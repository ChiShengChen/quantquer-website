<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 88" role="img" aria-labelledby="title desc">
  <title id="title">RGTK 睿基科技</title>
  <desc id="desc">Modernized RGTK wordmark with signal arcs and bilingual company name.</desc>
  <defs>
    <linearGradient id="rgtkTeal" x1="0" y1="4" x2="118" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#146264"/>
      <stop offset="0.52" stop-color="#0B3B3C"/>
      <stop offset="1" stop-color="#062626"/>
    </linearGradient>
    <linearGradient id="rgtkArc" x1="0" y1="2" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D7A68"/>
      <stop offset="1" stop-color="#0B3B3C"/>
    </linearGradient>
    <filter id="logoDepth" x="-8%" y="-18%" width="126%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#062626" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g filter="url(#logoDepth)">
    <path fill="url(#rgtkArc)" d="M0 24A14 14 0 0 1 14 38H0Z"/>
    <g fill="none" stroke="url(#rgtkArc)" stroke-linecap="butt" stroke-width="4.6">
      <path d="M0 2A36 36 0 0 1 36 38"/>
      <path d="M0 10A28 28 0 0 1 28 38"/>
      <path d="M0 18A20 20 0 0 1 20 38"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="butt" stroke-width="1.1" opacity="0.28">
      <path d="M2 4A32 32 0 0 1 34 36"/>
      <path d="M2 12A24 24 0 0 1 26 36"/>
      <path d="M2 20A16 16 0 0 1 18 36"/>
    </g>
    <text x="0" y="74" fill="url(#rgtkTeal)" font-family="'Manrope', 'Avenir Next', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-2">RGTK</text>
  </g>
  <line x1="132" y1="45" x2="132" y2="78" stroke="#E6DFD1" stroke-width="1.5" stroke-linecap="round"/>
  <text x="146" y="69" fill="#6B7670" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="19" font-weight="700" letter-spacing="3">睿基科技</text>
  <path d="M146 78h80" stroke="#F28F3B" stroke-width="2" stroke-linecap="round"/>
</svg>
